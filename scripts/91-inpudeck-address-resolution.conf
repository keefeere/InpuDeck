# InpuDeck: restore BlueZ address resolution only for explicitly listed peers.
# The root-owned file contains exact iPhone identity addresses, one per line.
# Missing/invalid/insecure files fail closed without changing another device.
[Service]
ExecStartPost=-/usr/bin/python3 /usr/local/libexec/inpudeck-le-address-resolution.py --adapter hci0 --device-file /etc/inpudeck/address-resolution-devices
