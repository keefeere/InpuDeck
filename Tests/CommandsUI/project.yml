name: CommandsUITests
options:
  bundleIdPrefix: com.keefeere.InpuDeck.tests
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  CommandsHost:
    type: application
    platform: iOS
    sources:
      - TestApp.swift
      - ConfiguredTabView.swift
      - TabSettingsView.swift
      - AppTabConfiguration.swift
      - Assets.xcassets
      - CommandPalettePage.swift
      - CommandPaletteView.swift
      - Commandlet.swift
      - ShortAndLongPressButtonStyle.swift
      - CommandUnlockState.swift
      - HID.swift
      - KeyComboParser.swift
      - MixedCommandParser.swift
      - TextTypingPlanner.swift
      - Localization.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSFaceIDUsageDescription: Test command authentication.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  CommandsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CommandsUITests.swift
    dependencies:
      - target: CommandsHost
    settings:
      base:
        TEST_TARGET_NAME: CommandsHost
schemes:
  CommandsHost:
    build:
      targets:
        CommandsHost: all
        CommandsUITests: [test]
    test:
      targets:
        - CommandsUITests
