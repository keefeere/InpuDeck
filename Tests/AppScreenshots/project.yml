name: AppScreenshots
options:
  bundleIdPrefix: com.keefeere.InpuDeck.screenshots
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  ScreenshotRunnerHost:
    type: application
    platform: iOS
    sources:
      - RunnerApp.swift
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  AppScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppScreenshotTests.swift
    dependencies:
      - target: ScreenshotRunnerHost
    settings:
      base:
        TEST_TARGET_NAME: ScreenshotRunnerHost
schemes:
  ScreenshotRunnerHost:
    build:
      targets:
        ScreenshotRunnerHost: all
        AppScreenshotTests: [test]
    test:
      targets:
        - AppScreenshotTests
