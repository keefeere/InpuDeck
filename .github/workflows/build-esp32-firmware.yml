name: Build ESP32-S3 firmware

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "inpudeck_bridge/**"
      - "scripts/install-esp32.py"
      - "scripts/install-esp32.sh"
      - "scripts/install-esp32.ps1"
      - "Tests/test_esp32_installer.py"
      - ".github/workflows/build-esp32-firmware.yml"
  push:
    paths:
      - "inpudeck_bridge/**"
      - "scripts/install-esp32.py"
      - "scripts/install-esp32.sh"
      - "scripts/install-esp32.ps1"
      - "Tests/test_esp32_installer.py"
      - ".github/workflows/build-esp32-firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test firmware installer
        run: |
          python3 -m unittest Tests/test_esp32_installer.py
          bash -n scripts/install-esp32.sh

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "NimBLE-Arduino@2.5.1"

      - name: Compile merged flash image
        run: |
          mkdir -p build/esp32-s3-zero dist
          arduino-cli compile \
            --fqbn esp32:esp32:waveshare_esp32_s3_zero \
            --board-options USBMode=default,CDCOnBoot=default,PSRAM=enabled,FlashMode=qio \
            --export-binaries \
            --output-dir build/esp32-s3-zero \
            inpudeck_bridge

          merged_bin="$(find build/esp32-s3-zero -maxdepth 1 -name '*.merged.bin' -print -quit)"
          test -n "$merged_bin"
          cp "$merged_bin" dist/InpuDeck-ESP32-S3-Zero.bin
          cp scripts/install-esp32.py dist/install-esp32.py
          cp scripts/install-esp32.sh dist/install-esp32.sh
          cp scripts/install-esp32.ps1 dist/install-esp32.ps1
          chmod +x dist/install-esp32.py
          chmod +x dist/install-esp32.sh
          cd dist
          sha256sum InpuDeck-ESP32-S3-Zero.bin \
            > InpuDeck-ESP32-S3-Zero.bin.sha256

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: InpuDeck-ESP32-S3-Zero-firmware
          path: |
            dist/InpuDeck-ESP32-S3-Zero.bin
            dist/InpuDeck-ESP32-S3-Zero.bin.sha256
            dist/install-esp32.py
            dist/install-esp32.sh
            dist/install-esp32.ps1
          if-no-files-found: error
          retention-days: 30
