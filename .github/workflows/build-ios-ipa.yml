name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "InpuDeck/**"
      - "InpuDeckShare/**"
      - "Shared/**"
      - "InpuDeck.xcodeproj/**"
      - "Tests/DirectHIDTests.swift"
      - "Tests/ESPBridgeStoreTests.swift"
      - "Tests/MouseButtonMaskTests.swift"
      - "scripts/test-direct-hid.sh"
      - "scripts/test-localizations.sh"
      - "scripts/build-unsigned-ipa.sh"
      - "scripts/update-sidestore-source.py"
      - "scripts/install-esp32.py"
      - "scripts/install-esp32.sh"
      - "Tests/test_esp32_installer.py"
      - "inpudeck_bridge/**"
      - ".github/workflows/build-ios-ipa.yml"
  push:
    branches:
      - main
    tags:
      - "ios-v*"
    paths:
      - "InpuDeck/**"
      - "InpuDeckShare/**"
      - "Shared/**"
      - "InpuDeck.xcodeproj/**"
      - "Tests/DirectHIDTests.swift"
      - "Tests/ESPBridgeStoreTests.swift"
      - "Tests/MouseButtonMaskTests.swift"
      - "scripts/test-direct-hid.sh"
      - "scripts/test-localizations.sh"
      - "scripts/build-unsigned-ipa.sh"
      - "scripts/update-sidestore-source.py"
      - "scripts/install-esp32.py"
      - "scripts/install-esp32.sh"
      - "Tests/test_esp32_installer.py"
      - "inpudeck_bridge/**"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Test firmware installers
        run: |
          python3 -m unittest Tests/test_esp32_installer.py
          bash -n scripts/install-esp32.sh

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install "NimBLE-Arduino@2.5.1"

      - name: Compile release firmware
        run: |
          mkdir -p build/esp32-s3-zero dist/esp32
          arduino-cli compile \
            --fqbn esp32:esp32:waveshare_esp32_s3_zero \
            --board-options USBMode=default,CDCOnBoot=default,PSRAM=enabled,FlashMode=qio \
            --export-binaries \
            --output-dir build/esp32-s3-zero \
            inpudeck_bridge

          merged_bin="$(find build/esp32-s3-zero -maxdepth 1 -name '*.merged.bin' -print -quit)"
          test -n "$merged_bin"
          cp "$merged_bin" dist/esp32/InpuDeck-ESP32-S3-Zero.bin
          cp scripts/install-esp32.py dist/esp32/install-esp32.py
          cp scripts/install-esp32.sh dist/esp32/install-esp32.sh
          chmod +x dist/esp32/install-esp32.py dist/esp32/install-esp32.sh
          cd dist/esp32
          sha256sum InpuDeck-ESP32-S3-Zero.bin \
            > InpuDeck-ESP32-S3-Zero.bin.sha256

      - name: Upload release firmware
        uses: actions/upload-artifact@v7
        with:
          name: InpuDeck-ESP32-S3-Zero-release
          path: dist/esp32
          if-no-files-found: error
          retention-days: 90

  build:
    needs: firmware
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test HID reports and session routing
        run: ./scripts/test-direct-hid.sh

      - name: Validate English and Ukrainian localizations
        run: bash ./scripts/test-localizations.sh

      - name: Install ldid
        run: brew install ldid

      - name: Build unsigned IPA
        run: ./scripts/build-unsigned-ipa.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: InpuDeck-unsigned
          path: |
            dist/InpuDeck-unsigned.ipa
            dist/InpuDeck-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Download released firmware
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: actions/download-artifact@v8
        with:
          name: InpuDeck-ESP32-S3-Zero-release
          path: dist/esp32

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/InpuDeck-unsigned.ipa \
            dist/InpuDeck-unsigned.ipa.sha256 \
            dist/esp32/InpuDeck-ESP32-S3-Zero.bin \
            dist/esp32/InpuDeck-ESP32-S3-Zero.bin.sha256 \
            dist/esp32/install-esp32.py \
            dist/esp32/install-esp32.sh \
            --generate-notes

      - name: Publish update to SideStore source
        if: startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          version="${GITHUB_REF_NAME#ios-v}"
          ipa_size="$(stat -f '%z' dist/InpuDeck-unsigned.ipa)"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/InpuDeck-unsigned.ipa"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # This runs on a tag, so origin/main is whatever it was when the run
          # checked out. Another merge landing meanwhile makes the push a
          # non-fast-forward and loses the release from the feed, so rebuild the
          # change on a freshly fetched main and retry rather than failing.
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --force-create sidestore-source-update origin/main
            python3 scripts/update-sidestore-source.py \
              --source sidestore-source.json \
              --version "$version" \
              --date "$(date -u +%F)" \
              --download-url "$download_url" \
              --size "$ipa_size" \
              --description "InpuDeck ${version}"

            git add sidestore-source.json
            if git diff --cached --quiet; then
              echo "::notice::SideStore source already lists ${version}"
              exit 0
            fi
            git commit -m "Update SideStore source for ${GITHUB_REF_NAME}"
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::main moved while publishing; retrying (attempt ${attempt})"
          done
          echo "::error::could not publish ${version} to the SideStore source"
          exit 1
