name: Test button presses

on:
  workflow_dispatch:
  pull_request:
    # The test app copies this production style; other app/Linux code is not
    # part of its build. Include the harness and workflow so test changes run.
    paths:
      - "InpuDeck/ShortAndLongPressButtonStyle.swift"
      - "InpuDeck/PressableKeyButton.swift"
      - "InpuDeck/KeyboardSwipePointer.swift"
      - "InpuDeck/EdgeTabNavigation.swift"
      - "InpuDeck/ConfiguredTabView.swift"
      - "InpuDeck/RemoteKeyboardView.swift"
      - "InpuDeck/ContentView.swift"
      - "InpuDeck/TrackpadView.swift"
      - "InpuDeck/ConnectionStatusView.swift"
      - "InpuDeck/CodeScannerView.swift"
      - "InpuDeck/InpuDeckApp.swift"
      - "Tests/KeyboardSwipePointerTests.swift"
      - "Tests/PressActions/**"
      - "scripts/test-press-actions.sh"
      - "scripts/parse-app-sources.sh"
      - ".github/workflows/test-press-actions.yml"

permissions:
  contents: read

jobs:
  # A syntax pass over the app views that no test target compiles. It exists so
  # a malformed SwiftUI file fails a pull request in a minute instead of a
  # release build ten minutes in; it does not replace the release `xcodebuild`.
  app-syntax:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Parse app sources
        run: ./scripts/parse-app-sources.sh

  press-ui-test:
    runs-on: macos-15
    # Hosted macOS runners queue often; the limit covers queue time too, so a
    # tight value kills the job before a runner is ever assigned.
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install UI test project generator
        run: brew install xcodegen

      - name: Test short and long button presses on iPhone Simulator
        run: ./scripts/test-press-actions.sh

      - name: Upload failed button UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: press-actions-test-results
          path: |
            dist/press-actions.xcresult
            dist/press-actions-tests.log
          if-no-files-found: ignore
          retention-days: 7
